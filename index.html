<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRa6a</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        background: #16171d;
        color: #f3f4f6;
        text-align: center;
      }
      h1 { font-size: 32px; margin: 0; }
      p { color: #9ca3af; max-width: 520px; line-height: 1.6; margin: 0; }
      a.game-link {
        display: inline-block;
        margin-top: 6px;
        padding: 12px 24px;
        border-radius: 8px;
        background: #aa3bff;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      a.game-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(170, 59, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <h1>DRa6a</h1>
    <p>欢迎来到我的 GitHub Pages。下方链接进入 AI 协作开发的多人卡牌游戏。</p>
    <a class="game-link" href="./ToDgame/">进入《终焉酒馆》→</a>
  </body>
</html>
